name: CD - Deploy to GKE

on:
  push:
    branches: ["main"]

jobs:
  cd-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.run_number }}
      REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REPOSITORY: ${{ secrets.GCP_REPOSITORY }}

    steps:
      # -------------------------------------------------
      # Checkout (avec submodules)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -------------------------------------------------
      # Auth GCP
      # -------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: kubectl

      # -------------------------------------------------
      # Docker auth
      # -------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $REGISTRY --quiet

      # -------------------------------------------------
      # Build & Push Backend
      # -------------------------------------------------
      - name: Build backend image
        working-directory: ./backend
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/$REPOSITORY/backend-app:$IMAGE_TAG .

      - name: Push backend image
        run: |
          docker push $REGISTRY/$PROJECT_ID/$REPOSITORY/backend-app:$IMAGE_TAG

      # -------------------------------------------------
      # Build & Push Frontend
      # -------------------------------------------------
      - name: Build frontend image
        working-directory: ./frontend
        run: |
          docker build -t $REGISTRY/$PROJECT_ID/$REPOSITORY/frontend-app:$IMAGE_TAG .

      - name: Push frontend image
        run: |
          docker push $REGISTRY/$PROJECT_ID/$REPOSITORY/frontend-app:$IMAGE_TAG

      # -------------------------------------------------
      # GKE Auth
      # -------------------------------------------------
      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GCP_CLUSTER_NAME }} \
            --zone ${{ secrets.GCP_CLUSTER_ZONE }} \
            --project $PROJECT_ID

      # -------------------------------------------------
      # Deploy Kubernetes
      # -------------------------------------------------
      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Apply Kubernetes manifests
        working-directory: ./k8s
        run: |
          for file in $(find . -name '*-template.yaml'); do
            envsubst < "$file" > "${file/-template.yaml/.yaml}"
          done
          kubectl apply -R -f .
