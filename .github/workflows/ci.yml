name: CI/CD - Django + React + GKE + Terraform
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci-tests:
    runs-on: ubuntu-latest
    env:
      # Variables conservées (non liées à la base de données)
      IMAGE_TAG: ${{ github.run_number }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      
    # SUPPRIMÉ : Le bloc 'services' complet (MySQL et Redis ont été retirés)
    # Les tests backend utiliseront SQLite en mémoire.
    # Les tests frontend sont isolés.

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # -------------------------
      # Backend setup (Tests Django)
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      
      # SUPPRIMÉ : L'étape 'Wait for MySQL' est inutile.
      # SUPPRIMÉ : L'étape 'Run Migrations' est inutile, 
      # car Django exécute automatiquement les migrations 
      # sur la base de données de test en mémoire (SQLite).

      - name: Run Backend Tests
        working-directory: ./backend
        # Django exécute les tests sur une base de données de test SQLite en mémoire
        run: python manage.py test

      # -------------------------
      # Frontend setup (Tests React)
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Frontend Tests
        working-directory: ./frontend
        # Assurez-vous que les tests s'exécutent en mode CI non-interactif
        run: npm run test -- --ci --watchAll=false 

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
