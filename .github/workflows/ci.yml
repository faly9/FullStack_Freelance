name: CI/CD - Django + React + GKE + Terraform

on:
  pull_request:
    branches: ["main"]

jobs:

  # =======================================================
  # 1️⃣ CI BACKEND - Django (pytest)
  # =======================================================
  backend:
    runs-on: ubuntu-latest
    env:
      CI: true
      SECRET_KEY: test-secret
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: ./backend
        run: python manage.py migrate

      - name: Run backend unit tests
        working-directory: ./backend
        run: pytest -m unit -v

      - name: Run backend integration tests
        working-directory: ./backend
        run: pytest -m integration -v

  # =======================================================
  # 2️⃣ CI FRONTEND - React (Vitest + Playwright)
  # =======================================================
  frontend:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Serve for Playwright E2E tests
        working-directory: ./frontend
        run: npx serve -s dist -l 5173 &

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173

      - name: Run unit tests
        working-directory: ./frontend
        run: npx vitest --run

      - name: Run E2E tests with Playwright
        working-directory: ./frontend
        run: npx playwright test --reporter=list,html

