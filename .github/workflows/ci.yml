name: CI/CD - Django + React + GKE + Terraform

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# -------------------------------
# Schéma logique du CI/CD
# -------------------------------
# Checkout repository
# ├─ Backend
# │  ├─ Install dependencies
# │  ├─ Migrate DB
# │  ├─ Unit tests (pytest -m unit)
# │  └─ Integration tests (pytest -m integration)
# └─ Frontend
#    ├─ Install dependencies
#    ├─ Unit tests (vitest)
#    ├─ E2E tests (playwright)
#    └─ Build

jobs:
  # -------------------------
  # CI Backend
  # -------------------------
  backend:
    runs-on: ubuntu-latest
    env:
      CI: true
      SECRET_KEY: test-secret
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run Django migrations
        working-directory: ./backend
        run: python manage.py migrate

      - name: Run backend unit tests
        working-directory: ./backend
        run: pytest -m unit --maxfail=1 --disable-warnings -v

      - name: Run backend integration tests
        working-directory: ./backend
        run: pytest -m integration --maxfail=1 --disable-warnings -v

  # -------------------------
  # CI Frontend
  # -------------------------
  frontend:
    runs-on: ubuntu-latest
    needs: backend   # optionnel : attend que backend soit ok
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install 

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: npx vitest --run

      - name: Run frontend E2E tests
        working-directory: ./frontend
        run: npx playwright test --reporter=list,html

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

