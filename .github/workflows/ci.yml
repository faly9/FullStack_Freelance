name: CI/CD - Django + React + GKE + Terraform

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci-tests:
    runs-on: ubuntu-latest
    env:
      CI: true   # 🔥 Active SQLite dans Django automatiquement
      SECRET_KEY: test-secret
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
         submodules: true

      # -------------------------
      # Backend setup (Django)
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run Django migrations (SQLite)
        working-directory: ./backend
        run: python manage.py migrate

      - name: Run backend tests (SQLite)
        working-directory: ./backend
        run: python manage.py test

      # -------------------------
      # Frontend setup (React)
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  # -------------------------
  # 2️⃣ CD : Build + Deploy
  # -------------------------
  cd-deploy:
    needs: ci-tests
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
         submodules: true 

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          version: 'latest'

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      # -------------------------
      # Build & Push Docker Images
      # -------------------------
      - name: Build Backend Image
        working-directory: ./backend
        run: docker build -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPOSITORY }}/backend:${IMAGE_TAG} .

      - name: Push Backend Image
        run: docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPOSITORY }}/backend:${IMAGE_TAG}

      - name: Build Frontend Image
        working-directory: ./frontend
        run: docker build -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPOSITORY }}/frontend:${IMAGE_TAG} .

      - name: Push Frontend Image
        run: docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_REPOSITORY }}/frontend:${IMAGE_TAG}

      # -------------------------
      # Deploy sur GKE
      # -------------------------
      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials ${{ secrets.GCP_CLUSTER_NAME }} \
            --zone ${{ secrets.GCP_CLUSTER_ZONE }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Apply Kubernetes Manifests
        working-directory: ./k8s
        run: kubectl apply -R -f k8s